name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://nri:ci-only-password@127.0.0.1:5432/nri_test
      SESSION_SECRET: ci-secret-is-not-for-deployment
    services:
      postgres:
        image: postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: nri
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: nri_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U nri -d nri_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.13.0
          package-manager-cache: false
      - run: corepack enable && corepack prepare pnpm@12.23.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit
      - name: Check tracked files for secrets
        run: node scripts/check-tracked-secrets.mjs
      - run: pnpm build
      - name: Validate operational configuration
        run: |
          node --check scripts/backup.mjs
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.production.yml config -q
        env:
          NRI_DATABASE_PASSWORD: ci-compose-validation-only
          WEB_ORIGIN: https://nri.example.invalid
          NRI_TLS_DIR: .
      - run: pnpm typecheck
      - run: pnpm db:migrate
      - run: pnpm test
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://nri:ci-only-password@127.0.0.1:5432/nri_test
          SESSION_SECRET: ci-secret-is-not-for-deployment
      - name: Start API for realtime smoke test
        run: |
          pnpm --filter @nri/server dev > /tmp/nri-server.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/ready; then exit 0; fi
            sleep 1
          done
          cat /tmp/nri-server.log
          exit 1
        env:
          NODE_ENV: test
          PORT: 3000
          HOST: 127.0.0.1
          WEB_ORIGIN: http://127.0.0.1:4175
          DATABASE_URL: postgres://nri:ci-only-password@127.0.0.1:5432/nri_test
          SESSION_SECRET: ci-secret-is-not-for-deployment
      - run: pnpm --filter @nri/server smoke
        env:
          NRI_API_URL: http://127.0.0.1:3000
          NODE_ENV: test
          DATABASE_URL: postgres://nri:ci-only-password@127.0.0.1:5432/nri_test
          SESSION_SECRET: ci-secret-is-not-for-deployment
      - name: Test token movement transactions and permissions
        run: pnpm --filter @nri/server test:movement
        env:
          NRI_API_URL: http://127.0.0.1:3000
      - name: Test scene object lifecycle transactions and permissions
        run: pnpm --filter @nri/server test:object-lifecycle
        env:
          NRI_API_URL: http://127.0.0.1:3000
      - name: Test scoped scene content event delivery
        run: pnpm --filter @nri/server test:realtime
        env:
          NRI_API_URL: http://127.0.0.1:3000
      - name: Test private channel permissions and delivery
        run: |
          node apps/server/dist/index.js > /tmp/nri-private-server.log 2>&1 &
          private_api=$!
          trap 'kill "$private_api" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent "$NRI_API_URL/api/ready"; then
              pnpm --filter @nri/server test:private-channels
              exit $?
            fi
            sleep 1
          done
          cat /tmp/nri-private-server.log
          exit 1
        env:
          NRI_API_URL: http://127.0.0.1:3003
          HOST: 127.0.0.1
          PORT: 3003
          WEB_ORIGIN: http://127.0.0.1:4175
          UPLOAD_DIR: /tmp/nri-private-media
      - name: Test transactional command authorization and media compensation
        run: |
          node apps/server/dist/index.js > /tmp/nri-command-acl-server.log 2>&1 &
          command_api=$!
          trap 'kill "$command_api" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent "$NRI_API_URL/api/ready"; then
              pnpm --filter @nri/server test:command-authorization
              exit $?
            fi
            sleep 1
          done
          cat /tmp/nri-command-acl-server.log
          exit 1
        env:
          NODE_ENV: test
          PORT: 3004
          HOST: 127.0.0.1
          WEB_ORIGIN: http://127.0.0.1:4175
          DATABASE_URL: postgres://nri:ci-only-password@127.0.0.1:5432/nri_test
          SESSION_SECRET: ci-secret-is-not-for-deployment
          NRI_API_URL: http://127.0.0.1:3004
          UPLOAD_DIR: /tmp/nri-command-media
      - name: Test RT-RETRY on an isolated PostgreSQL database
        run: |
          createdb -h 127.0.0.1 -U nri nri_retry_test
          DATABASE_URL=postgres://nri:ci-only-password@127.0.0.1:5432/nri_retry_test pnpm db:migrate
          node apps/server/dist/index.js > /tmp/nri-retry-server.log 2>&1 &
          retry_api=$!
          trap 'kill "$retry_api" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent "$NRI_API_URL/api/ready"; then
              pnpm --filter @nri/server test:retry
              exit $?
            fi
            sleep 1
          done
          cat /tmp/nri-retry-server.log
          exit 1
        env:
          NODE_ENV: test
          PORT: 3005
          HOST: 127.0.0.1
          WEB_ORIGIN: http://127.0.0.1:4175
          DATABASE_URL: postgres://nri:ci-only-password@127.0.0.1:5432/nri_retry_test
          SESSION_SECRET: ci-secret-is-not-for-deployment
          NRI_API_URL: http://127.0.0.1:3005
          NRI_ENABLE_TEST_FAULTS: "true"
          UPLOAD_DIR: /tmp/nri-retry-media
      - name: Verify retry migration upgrade preserves existing chat and dice rows
        run: |
          PGPASSWORD=ci-only-password createdb -h 127.0.0.1 -U nri nri_retry_upgrade_test
          pnpm --filter @nri/server test:retry-migration-upgrade
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://nri:ci-only-password@127.0.0.1:5432/nri_retry_upgrade_test
      - name: Start fresh API for browser tests
        run: |
          cd apps/server
          node dist/index.js > /tmp/nri-browser-server.log 2>&1 &
          echo "NRI_BROWSER_API_PID=$!" >> "$GITHUB_ENV"
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3001/api/ready; then exit 0; fi
            sleep 1
          done
          cat /tmp/nri-browser-server.log
          exit 1
        env:
          NODE_ENV: test
          PORT: 3001
          HOST: 127.0.0.1
          WEB_ORIGIN: http://127.0.0.1:4175
          DATABASE_URL: postgres://nri:ci-only-password@127.0.0.1:5432/nri_test
          SESSION_SECRET: ci-secret-is-not-for-deployment
      - name: Install Playwright Chromium
        run: pnpm --filter @nri/web exec playwright install --with-deps chromium
      - name: Smoke-test the built Pixi renderer
        run: pnpm --filter @nri/web e2e texture-lifecycle
        env:
          CI: true
          API_PROXY_TARGET: http://127.0.0.1:3001
          NRI_E2E_PREVIEW: "true"
      - name: Run browser integration and privacy scenarios
        run: pnpm --filter @nri/web e2e
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4175
          API_PROXY_TARGET: http://127.0.0.1:3001
          NODE_ENV: test
          HOST: 127.0.0.1
          PORT: 3001
          WEB_ORIGIN: http://127.0.0.1:4175
          DATABASE_URL: postgres://nri:ci-only-password@127.0.0.1:5432/nri_test
          SESSION_SECRET: ci-secret-is-not-for-deployment
